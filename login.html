<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 墨香书阁</title>

    <!-- 第三方库 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
    <script src="https://unpkg.com/element-plus/dist/locale/zh-cn.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue/dist/index.iife.min.js"></script>

    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/page/login.css">
</head>

<body class="auth-body">
    <!--
      登录页 login.html
      覆盖技术点：
        - HTML5 语义化 + form 表单（input type=email/password/checkbox）
        - CSS3 渐变背景 + 卡片阴影 + Flexbox 居中
        - JS 表单验证（正则邮箱 / 密码长度）
        - localStorage 用户校验 + 登录状态持久化
    -->
    <div id="app">
        <!-- 返回首页 -->
        <a href="index.html" class="auth-back">
            <el-icon><ArrowLeft /></el-icon>
            返回首页
        </a>

        <div class="auth-container">
            <div class="auth-card">
                <!-- 头部 Logo -->
                <div class="auth-card__header">
                    <a href="index.html" class="auth-card__logo">墨香书阁</a>
                    <p class="auth-card__subtitle">欢迎回来，请登录您的账号</p>
                </div>

                <!-- 登录表单 -->
                <el-form ref="loginFormRef" :model="loginForm" :rules="loginRules"
                         class="auth-card__form" @submit.prevent="handleLogin">
                    <el-form-item prop="account">
                        <el-input v-model="loginForm.account"
                                  placeholder="邮箱 / 用户名"
                                  size="large" clearable>
                            <template #prefix><el-icon><User /></el-icon></template>
                        </el-input>
                    </el-form-item>

                    <el-form-item prop="password">
                        <el-input v-model="loginForm.password"
                                  type="password"
                                  placeholder="密码（至少 6 位）"
                                  size="large" show-password>
                            <template #prefix><el-icon><Lock /></el-icon></template>
                        </el-input>
                    </el-form-item>

                    <div class="auth-card__options">
                        <el-checkbox v-model="rememberMe">记住我</el-checkbox>
                        <a href="javascript:;" class="auth-card__forgot">忘记密码？</a>
                    </div>

                    <el-button type="primary" size="large" native-type="submit"
                               class="auth-card__btn" :loading="loading">
                        登 录
                    </el-button>
                </el-form>

                <div class="auth-card__footer">
                    还没有账号？<a href="register.html" class="auth-card__link">立即注册</a>
                </div>
            </div>

            <!-- 侧边宣传语 -->
            <div class="auth-side">
                <h2 class="auth-side__title">阅读 · 让生活更美好</h2>
                <p class="auth-side__desc">
                    登录后可收藏心仪图书、订阅新书资讯、同步阅读记录。
                </p>
                <ul class="auth-side__list">
                    <li>· 精选 10 万+ 优质图书</li>
                    <li>· 每日推荐，个性化书单</li>
                    <li>· 书友社区，分享阅读心得</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/page/login.js"></script>
</body>

</html>
